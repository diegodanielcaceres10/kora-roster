<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kora Roster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/0363d3b567.js" crossorigin="anonymous" defer></script>
    <style>
      /*
        Plain, self-contained styles (hardcoded colors, not the --kora-* custom
        properties) so this shows correctly from the very first paint, before
        global.scss / the design tokens are even loaded. That's the whole
        point: this can't depend on the same styles it's meant to be masking
        the loading of.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #051f19;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #051f19;
        transition: opacity 200ms ease;
      }

      .app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }

      #app-loader__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid rgba(244, 246, 239, 0.35);
        border-top-color: #f4f6ef;
        animation: app-loader-spin 700ms linear infinite;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader"><div id="app-loader__spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        function hideLoader() {
          var el = document.getElementById("app-loader");
          if (!el) return;
          el.classList.add("app-loader--hidden");
          setTimeout(function () {
            el.remove();
          }, 250);
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(hideLoader);
        } else {
          hideLoader();
        }

        // Safety net: never block the app forever if font loading hangs
        // (flaky network, browser quirk, etc).
        setTimeout(hideLoader, 4000);
      })();
    </script>
  </body>
</html>
